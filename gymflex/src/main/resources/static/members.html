<!DOCTYPE html>
<html>
<head>
    <title>GymFlex - Members</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .box {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #222;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #222;
            color: white;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>👤 GymFlex Members</h1>
    <p>Manage Gym Members</p>
</header>

<div class="container">

    <a class="back" href="index.html">← Back to Dashboard</a>

    <div class="box">

        <h2>Add New Member</h2>

        <input type="text" id="name" placeholder="Name">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="phone" placeholder="Phone">

        <button onclick="addMember()">Add Member</button>

    </div>

    <div class="box">

        <h2>Member List</h2>

        <button onclick="loadMembers()">Refresh Members</button>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>
            </thead>

            <tbody id="memberTable">
            </tbody>
        </table>

    </div>

</div>

<script>

    function loadMembers() {

        fetch("/members")
            .then(response => response.json())
            .then(members => {

                const table = document.getElementById("memberTable");

                table.innerHTML = "";

                members.forEach(member => {

                    table.innerHTML += `
                        <tr>
                            <td>${member.id}</td>
                            <td>${member.name}</td>
                            <td>${member.email}</td>
                            <td>${member.phone}</td>
                        </tr>
                    `;
                });
            });
    }


    function addMember() {

        const member = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value
        };

        fetch("/members", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(member)
        })
            .then(response => response.json())
            .then(data => {

                alert("Member added successfully!");

                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                document.getElementById("phone").value = "";

                loadMembers();
            });
    }

    loadMembers();

</script>

</body>
</html>
