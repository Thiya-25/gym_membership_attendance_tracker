<!DOCTYPE html>
<html>
<head>
    <title>GymFlex</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background-color: white;
            padding: 25px;
            width: 180px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h2 {
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #222;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>🏋️ GymFlex</h1>
    <p>Gym Membership & Attendance Management</p>
</header>

<div class="container">

    <h2>Welcome to GymFlex</h2>
    <p>Manage members, plans, memberships and attendance easily.</p>

    <div class="cards">

        <div class="card">
            <h2>👤</h2>
            <h3>Members</h3>
            <p>Manage gym members</p>
            <a href="members.html">
                <button>View Members</button>
            </a>
        </div>

        <div class="card">
            <h2>📋</h2>
            <h3>Plans</h3>
            <p>Manage gym plans</p>
            <a href="plans.html">
                <button>View Plans</button>
            </a>
        </div>

        <div class="card">
            <h2>💳</h2>
            <h3>Memberships</h3>
            <p>Manage memberships</p>
            <a href="memberships.html">
                <button>View Memberships</button>
            </a>
        </div>

        <div class="card">
            <h2>✅</h2>
            <h3>Check-In</h3>
            <p>Record attendance</p>
            <a href="checkin.html">
                <button>Check In</button>
            </a>

    </div>

</div>

</body>
</html>
